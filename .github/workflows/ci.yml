name: CI

on:
  push:
    branches: [main, csharp]
  pull_request:
    branches: [main, csharp]
  workflow_dispatch:

# A force-push to a PR branch should cancel the superseded run rather than
# queue behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build-and-test:
    name: Build and unit-test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore whois-server.slnx

      # -warnaserror because the tree is warning-clean today (a Roslyn
      # analyzer strict-mode pass was part of the port); this keeps it that way.
      - name: Build
        run: dotnet build whois-server.slnx -c Release --no-restore -warnaserror

      # Core + Plugins only. These need no network, so they are the blocking
      # gate; the live-network integration suite runs separately below.
      - name: Unit tests (Core)
        run: dotnet test tests/WhoisServer.Core.Tests/WhoisServer.Core.Tests.csproj -c Release --no-build

      - name: Unit tests (Plugins)
        run: dotnet test tests/WhoisServer.Plugins.Tests/WhoisServer.Plugins.Tests.csproj -c Release --no-build

  format:
    name: Code style
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore whois-server.slnx

      # Same check as `make format-check`; run `make format` to fix locally.
      - name: dotnet format --verify-no-changes
        run: dotnet format whois-server.slnx --verify-no-changes

  cut-builds:
    name: Cut build (${{ matrix.name }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Feature flags are a headline requirement of this project, not a
    # nice-to-have: each combination below must produce a genuinely compiling
    # binary with the disabled code and dependencies eliminated. Without this
    # matrix, a flag only ever gets exercised in its default position.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no-dn42
            flags: -p:Feature_Dn42=false
          - name: no-web
            flags: -p:Feature_Web=false
          - name: no-plugins
            flags: -p:Feature_Plugins=false
          - name: no-packages
            flags: -p:Feature_Packages=false
          - name: no-telemetry
            flags: -p:Feature_Telemetry=false
          # The one flag that ships OFF by default, so its ON position is the
          # untested one — it swaps the default resolution order to RDAP-first.
          - name: rdap-backend
            flags: -p:Feature_RdapBackend=true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Build with ${{ matrix.flags }}
        run: dotnet build whois-server.slnx -c Release -warnaserror ${{ matrix.flags }}

  minimal-build:
    name: Cut build (every feature off)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      # Derived from Directory.Build.props rather than hardcoded, so a flag
      # added there is covered by this job automatically instead of silently
      # staying untested in its off position.
      - name: Derive all-features-off flag list
        id: flags
        run: |
          flags=$(grep -oE '<Feature_[A-Za-z]+ ' Directory.Build.props \
            | tr -d '< ' | sort -u | sed 's/^/-p:/;s/$/=false/' | tr '\n' ' ')
          echo "Disabling $(echo "$flags" | wc -w) features:"
          echo "$flags" | tr ' ' '\n'
          echo "value=$flags" >> "$GITHUB_OUTPUT"

      - name: Build with every feature disabled
        run: dotnet build whois-server.slnx -c Release -warnaserror ${{ steps.flags.outputs.value }}

  deb-package:
    name: Debian package (build, install, purge)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # An install test, not just a build test. Almost everything that can go
    # wrong with this package goes wrong at install or first boot — the service
    # account, the CAP_NET_BIND_SERVICE grant that lets a non-root process bind
    # port 43, the ASPNETCORE_CONTENTROOT split between /usr/lib and
    # /var/lib — and none of it is visible from `dpkg-deb --build` succeeding.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Build .deb
        run: packaging/deb/build-deb.sh --version 0.0.1

      # apt, not `dpkg -i`, so the dependency list in the control file is
      # actually resolved — a wrong libicu alternative would pass dpkg and fail
      # here, which is the whole point.
      - name: Install
        run: sudo apt-get install -y ./dist/whois-server_0.0.1_amd64.deb

      - name: Service starts and binds the privileged port unprivileged
        run: |
          for _ in $(seq 1 30); do
            systemctl is-active --quiet whois-server && break
            sleep 1
          done
          systemctl is-active whois-server
          # Running as the service account, not root: this is what the ambient
          # capability buys, and a regression would silently fall back to root.
          test "$(systemctl show -p User --value whois-server)" = whois-server
          ss -tlnp | grep -E ':43\b'

      - name: WHOIS query over TCP 43
        run: |
          sudo apt-get install -y netcat-openbsd
          printf 'HELP\r\n' | nc -q 5 127.0.0.1 43 | head -20 | tee /tmp/help.txt
          test -s /tmp/help.txt

      # The dashboard is served out of /usr/lib/whois-server/wwwroot while the
      # process runs from /var/lib/whois-server, so a 200 here is the only proof
      # the content-root override in the unit file is doing its job.
      - name: Dashboard responds from the split content root
        run: curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:9999/

      - name: State landed under /var/lib
        run: |
          sudo test -d /var/lib/whois-server/cache
          sudo find /var/lib/whois-server -maxdepth 2 -ls

      - name: Purge leaves nothing behind
        run: |
          sudo apt-get purge -y whois-server
          test ! -e /var/lib/whois-server
          test ! -e /usr/lib/whois-server
          test ! -e /etc/default/whois-server
          ! getent passwd whois-server

  rpm-package:
    name: RPM package (build, install on Fedora, erase)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Built on Ubuntu (rpmbuild compiles nothing here — see the spec header) but
    # installed on real Fedora, because that is the only way to find out whether
    # the hand-written Requires list actually resolves against distro repos and
    # whether the bundled runtime runs on a non-Debian libc/ICU. The .deb job
    # covers the systemd side; a container has no PID 1 to test that with.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Install rpmbuild
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build .rpm
        run: packaging/rpm/build-rpm.sh --version 0.0.1

      - name: Inspect package metadata
        run: |
          rpm -qip dist/whois-server-0.0.1-1.x86_64.rpm
          echo '--- requires ---'; rpm -qp --requires dist/*.rpm
          echo '--- payload ---';  rpm -qlp dist/*.rpm | grep -v '^/usr/lib/whois-server/'

      # dnf install, not rpm -i, so the Requires above are resolved for real.
      # --nogpgcheck because release packages are signed by the Release workflow,
      # not here; without it dnf rejects the unsigned local file outright.
      # The systemctl calls in %post fail inside a container and are swallowed by
      # the scriptlets' `|| :`, which is the intended behaviour there.
      - name: Install and smoke-test on Fedora
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:latest bash -euxo pipefail -c '
            dnf install -y --nogpgcheck /dist/whois-server-0.0.1-1.x86_64.rpm

            # %pre created the account, and %attr resolved it at install time.
            id whois-server
            test "$(stat -c "%U:%G %a" /var/lib/whois-server)"       = "whois-server:whois-server 750"
            test "$(stat -c "%U:%G %a" /var/lib/whois-server/cache)" = "whois-server:whois-server 750"
            test "$(stat -c "%U:%G %a" /etc/sysconfig/whois-server)" = "root:whois-server 640"

            # The bundled runtime executing on Fedora at all is the point of the
            # hand-written dependency list; --help exits 0 without touching state.
            /usr/bin/whois-server --help | head -3

            test -f /usr/lib/systemd/system/whois-server.service
            test -f /usr/share/whois-server/plugins/weather/plugin.json

            dnf remove -y whois-server
            test ! -e /usr/lib/whois-server
            test ! -e /usr/bin/whois-server
          '

  integration-tests:
    name: Integration tests (live network)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Non-blocking on purpose. This suite boots the real host and queries real
    # WHOIS/RDAP/HTTP infrastructure, so a failure here is as likely to mean
    # "whois.verisign-grs.com rate-limited the runner" as "we broke something".
    # Read the log before believing a red mark; do not gate merges on it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Integration tests
        run: dotnet test tests/WhoisServer.Integration.Tests/WhoisServer.Integration.Tests.csproj -c Release
